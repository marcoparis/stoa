services:
  - type: web
    name: expressbookreviews
    runtime: node
    plan: free
    rootDir: final_project
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /isbn/1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
